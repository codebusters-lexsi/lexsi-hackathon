# AlignTune Configuration: Cohere Tiny Aya Global on CURATED REE Dataset
# Track 1: Problem 8 (Curated Run - CuratorKIT Filtered)

algo: sft
backend: trl

model:
  name_or_path: "CohereLabs/tiny-aya-global"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  use_gradient_checkpointing: true

data:
  train_file: "curated_dataset.jsonl"
  format: "chat"
  chat_template: "messages"
  max_seq_length: 1024

peft:
  peft_type: "LORA"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "models/adapters/tiny-aya-global-curated"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 1
  evaluation_strategy: "no"
  fp16: false
  bf16: true
  report_to: "none"
